name: Website review only
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install review-only dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Validate static routes and original content
        run: |
          mkdir -p "$RUNNER_TEMP/site-review"
          python3 tools/check_site.py | tee "$RUNNER_TEMP/site-review/static-report.json"
      - name: Test responsive layout and accessibility; capture before and after
        env:
          SITE_QA_OUTPUT: ${{ runner.temp }}/site-review
        run: npm run test:browser
      - name: Record review provenance
        if: success()
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'site-review'
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          browser=json.loads((root/'browser-report.json').read_text())
          assert browser['status']=='PASS' and not browser['issues']
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root/'review-metadata.json').write_text(json.dumps({'source_commit':commit,'production_deployed':False,'files_sha256':files},indent=2))
          print(f"::notice title=Website review verified::source={commit} layout_checks={len(browser['checks'])} axe_checks={browser['axeChecks']} screenshots={len(browser['screenshots'])} production_deployed=false")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wonwinnie-multiapp-review
          path: ${{ runner.temp }}/site-review
          if-no-files-found: error
          retention-days: 30
